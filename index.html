<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#F4F7FB" />
  <title>PM Sprint OS — Summer 2027 Recruiting Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F4F7FB;
      --surface: #FFFFFF;
      --surface-tonal: #EAF0F8;
      --text: #181C23;
      --text-muted: #5F6775;
      --border: rgba(26, 115, 232, 0.14);
      --blue: #1A73E8;
      --blue-soft: #E8F0FE;
      --green: #1E8E3E;
      --green-soft: #E6F4EA;
      --yellow: #E37400;
      --yellow-soft: #FEF7E0;
      --red: #D93025;
      --red-soft: #FCE8E6;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    body.dark {
      --bg: #0D1015;
      --surface: #161B24;
      --surface-tonal: #1F2633;
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --border: rgba(138, 180, 248, 0.16);
      --blue: #8AB4F8;
      --blue-soft: rgba(138, 180, 248, 0.16);
      --green: #81C995;
      --green-soft: rgba(129, 201, 149, 0.16);
      --yellow: #FDD663;
      --yellow-soft: rgba(253, 214, 99, 0.16);
      --red: #F28B82;
      --red-soft: rgba(242, 139, 130, 0.16);
      --shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 16px 96px;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top App Header */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding: 4px 2px;
    }

    .glance-cluster {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .live-date {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .countdown-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .days-hero {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.6px;
    }

    .target-pill {
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 11.5px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .top-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: var(--shadow);
    }

    /* Mode Banner */
    .mode-banner {
      background: var(--blue-soft);
      color: var(--blue);
      border-radius: 16px;
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .mode-banner button {
      background: var(--blue);
      color: #FFFFFF;
      border: none;
      border-radius: 999px;
      padding: 5px 12px;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    body.dark .mode-banner button { color: #0D1015; }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .horizon-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .segmented-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      height: 8px;
      margin-bottom: 14px;
    }

    .seg-track {
      background: var(--surface-tonal);
      border-radius: 999px;
      overflow: hidden;
    }

    .seg-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .track-tabs {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .track-tab {
      background: var(--surface-tonal);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-family: inherit;
      color: var(--text);
      transition: all 0.2s ease;
    }

    .track-tab.active {
      background: var(--surface);
      border-color: var(--blue);
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.14);
    }

    .track-tab-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .track-code {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-muted);
    }

    .track-name {
      font-size: 13px;
      font-weight: 700;
    }

    .track-stat {
      font-size: 13px;
      font-weight: 800;
    }

    /* Active Focus Card */
    .focus-card {
      position: relative;
      touch-action: pan-y;
    }

    .focus-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .pace-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 5px 11px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }

    .nav-arrows {
      display: flex;
      gap: 6px;
    }

    .circle-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-tonal);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }

    .focus-headline {
      font-size: 21px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .focus-meta {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .focus-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-cluster {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pct-big {
      font-size: 18px;
      font-weight: 800;
    }

    .rep-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-minus {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface-tonal);
      color: var(--text);
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .btn-primary {
      height: 40px;
      padding: 0 18px;
      border-radius: 999px;
      border: none;
      background: var(--blue);
      color: #FFFFFF;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(26, 115, 232, 0.28);
    }

    body.dark .btn-primary { color: #0D1015; }
    .btn-primary:active { transform: scale(0.96); }

    /* Working Log / Mini-CRM */
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .log-header h3 {
      font-size: 15px;
      font-weight: 800;
    }

    .quota-edit-btn {
      background: none;
      border: none;
      color: var(--blue);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .add-input {
      flex: 1;
      height: 42px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface-tonal);
      color: var(--text);
      padding: 0 14px;
      font-family: inherit;
      font-size: 13.5px;
      outline: none;
    }

    .add-input:focus {
      border-color: var(--blue);
      background: var(--surface);
    }

    .add-submit {
      height: 42px;
      padding: 0 16px;
      border-radius: 14px;
      border: none;
      background: var(--text);
      color: var(--surface);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .entry-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 16px;
      background: var(--surface-tonal);
      font-size: 13.5px;
    }

    .entry-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      cursor: pointer;
    }

    .check-box {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 2px solid var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #FFF;
      flex-shrink: 0;
    }

    .entry-item.done .check-box {
      background: var(--blue);
    }

    body.dark .entry-item.done .check-box { color: #0D1015; }

    .entry-item.done .entry-text {
      text-decoration: line-through;
      opacity: 0.55;
    }

    .entry-date {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .del-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }

    /* Bottom Wallpaper Sync Bar */
    .bottom-dock {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 540px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 10px 8px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.16);
      z-index: 50;
    }

    .dock-text {
      font-size: 12.5px;
      font-weight: 700;
    }

    .dock-sub {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
    }
  </style>
</head>
<body>

  <main class="app-container">
    <!-- Live Header -->
    <header class="topbar">
      <div class="glance-cluster">
        <span class="live-date" id="liveDateText">Loading date...</span>
        <div class="countdown-row">
          <span class="days-hero" id="daysLeftText">70 days left</span>
          <button class="target-pill" id="targetDateBtn" onclick="editTargetDate()">Target: Jan 31, 2027 ✎</button>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="dataModeBtn" onclick="toggleDataMode()">↺ Fresh 0</button>
        <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark</button>
      </div>
    </header>

    <!-- Helpful Onboarding Banner -->
    <div class="mode-banner" id="modeBanner">
      <span id="bannerText">✦ Viewing prefilled sample sprint — edit anything or start from zero.</span>
      <button id="bannerActionBtn" onclick="toggleDataMode()">Start Fresh (0)</button>
    </div>

    <!-- Parallel Master Horizon -->
    <section class="card">
      <div class="horizon-header">
        <span>4 PARALLEL RECRUITING TRACKS</span>
        <span id="overallPctText">0% OVERALL</span>
      </div>
      <div class="segmented-bar" id="segmentedBar"></div>
      <div class="track-tabs" id="trackTabs"></div>
    </section>

    <!-- Active Track Focus Card -->
    <section class="card focus-card" id="focusCard">
      <div class="focus-top">
        <span class="pace-badge" id="paceBadge">ON PACE</span>
        <div class="nav-arrows">
          <button class="circle-btn" onclick="switchTrack(-1)" aria-label="Previous">‹</button>
          <button class="circle-btn" onclick="switchTrack(1)" aria-label="Next">›</button>
        </div>
      </div>

      <h2 class="focus-headline" id="focusHeadline">Track Title</h2>
      <p class="focus-meta" id="focusMeta">Checkpoint · Pace Calculation</p>

      <div class="focus-controls">
        <div class="progress-cluster">
          <svg width="48" height="48" viewBox="0 0 48 48">
            <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(128,128,128,0.2)" stroke-width="5" />
            <circle id="ringCircle" cx="24" cy="24" r="20" fill="none" stroke="#1A73E8" stroke-width="5"
              stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="125.66" transform="rotate(-90 24 24)" />
          </svg>
          <div>
            <div class="pct-big" id="focusPct">0%</div>
            <div style="font-size:11px;color:var(--text-muted);font-weight:700;" id="focusFraction">0 / 15</div>
          </div>
        </div>

        <div class="rep-actions">
          <button class="btn-minus" onclick="adjustCount(-1)" title="Decrease count">−</button>
          <button class="btn-primary" id="logRepBtn" onclick="adjustCount(1)">+1 Log Rep</button>
        </div>
      </div>
    </section>

    <!-- Real Interactive Log / Mini-CRM for Active Track -->
    <section class="card">
      <div class="log-header">
        <h3 id="logSectionTitle">M2 Coffee Chats Log</h3>
        <button class="quota-edit-btn" onclick="editTrackTarget()">Edit Goal Target ✎</button>
      </div>

      <form class="add-form" onsubmit="addEntry(event)">
        <input class="add-input" id="entryInput" type="text" placeholder="Add a person, company, or task..." required />
        <button class="add-submit" type="submit">Add</button>
      </form>

      <div class="entry-list" id="entryList"></div>
    </section>
  </main>

  <!-- Floating Lock Screen Sync Bar -->
  <div class="bottom-dock">
    <div>
      <span class="dock-text">Lock Screen Wallpaper</span>
      <span class="dock-sub">Exports live 9:16 PNG with your current stats</span>
    </div>
    <button class="btn-primary" onclick="exportLockScreenPNG()">⬇ Sync PNG</button>
  </div>

  <canvas id="wallpaperCanvas" style="display:none;"></canvas>

  <script>
    const STORAGE_KEY = 'pm_sprint_os_v3';

    function buildSampleState(darkMode = false) {
      return {
        targetDate: '2027-01-31',
        activeIndex: 1,
        darkMode,
        isSample: true,
        tracks: [
          {
            id: 'M1',
            short: 'Portfolio',
            title: 'Portfolio & Resume Live',
            checkpoint: '2026-12-10',
            checkpointLabel: 'Dec 10',
            done: 4,
            target: 4,
            color: '#1E8E3E',
            soft: 'var(--green-soft)',
            placeholder: 'e.g., Quantify search latency metric on Case Study 2...',
            entries: [
              { id: 1, text: 'Ship personal PM portfolio site on custom domain', completed: true, date: 'Nov 18' },
              { id: 2, text: 'Rewrite 3 resume bullets with measurable retention impact', completed: true, date: 'Nov 20' }
            ]
          },
          {
            id: 'M2',
            short: 'Chats',
            title: '15 PM Coffee Chats Complete',
            checkpoint: '2026-12-28',
            checkpointLabel: 'Dec 28',
            done: 8,
            target: 15,
            color: '#1A73E8',
            soft: 'var(--blue-soft)',
            placeholder: 'e.g., Sarah Chen (Google APM Alum) — sent LinkedIn note...',
            entries: [
              { id: 101, text: 'Chat with Alex R. (Google Core Search PM)', completed: true, date: 'Nov 19' },
              { id: 102, text: 'Follow up with Priya M. (YouTube Product) for referral', completed: false, date: 'Today' }
            ]
          },
          {
            id: 'M3',
            short: 'Apps',
            title: '30 High-Conviction Apps Submitted',
            checkpoint: '2027-01-15',
            checkpointLabel: 'Jan 15',
            done: 4,
            target: 30,
            color: '#E37400',
            soft: 'var(--yellow-soft)',
            placeholder: 'e.g., Google Summer 2027 APM Internship (Submitted)...',
            entries: [
              { id: 201, text: 'Google — Associate Product Manager Intern (Summer 2027)', completed: true, date: 'Nov 21' },
              { id: 202, text: 'Stripe — Product Management Intern (Drafting essay)', completed: false, date: 'In Progress' }
            ]
          },
          {
            id: 'M4',
            short: 'Prep',
            title: '10 Mock Loops & Offer Ready',
            checkpoint: '2027-01-31',
            checkpointLabel: 'Jan 31',
            done: 2,
            target: 10,
            color: '#D93025',
            soft: 'var(--red-soft)',
            placeholder: 'e.g., Product Sense drill: Design Maps for visually impaired...',
            entries: [
              { id: 301, text: 'Product Sense mock #1 — Metrics & trade-offs review', completed: true, date: 'Nov 20' },
              { id: 302, text: 'Execution drill: Diagnose 15% drop in Gmail open rate', completed: false, date: 'Scheduled' }
            ]
          }
        ]
      };
    }

    function buildFreshState(darkMode = false) {
      const fresh = buildSampleState(darkMode);
      fresh.isSample = false;
      fresh.activeIndex = 0;
      fresh.tracks.forEach(t => {
        t.done = 0;
        t.entries = [];
      });
      return fresh;
    }

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? JSON.parse(saved) : buildSampleState(false);
      } catch {
        return buildSampleState(false);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function toggleDataMode() {
      if (state.isSample) {
        state = buildFreshState(state.darkMode);
      } else {
        state = buildSampleState(state.darkMode);
      }
      saveState();
      render();
    }

    function daysUntil(dateStr) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const [y, m, d] = dateStr.split('-').map(Number);
      const target = new Date(y, m - 1, d);
      const diff = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
      return Math.max(0, diff);
    }

    function render() {
      document.body.classList.toggle('dark', state.darkMode);
      document.getElementById('themeBtn').textContent = state.darkMode ? '☀️ Light' : '🌙 Dark';

      // Update sample/fresh toggle UI
      document.getElementById('dataModeBtn').textContent = state.isSample ? '↺ Fresh 0' : '✦ Sample';
      document.getElementById('bannerText').textContent = state.isSample
        ? '✦ Sample sprint loaded — edit anything or switch to a blank tracker.'
        : '✓ Personal tracker active — all entries auto-save in your browser.';
      document.getElementById('bannerActionBtn').textContent = state.isSample
        ? 'Start Fresh (0)'
        : 'Load Sample Data';

      // Live real-world date & countdown
      const now = new Date();
      document.getElementById('liveDateText').textContent = now.toLocaleDateString('en-US', {
        weekday: 'short', month: 'short', day: 'numeric', year: 'numeric'
      });

      const daysLeft = daysUntil(state.targetDate);
      document.getElementById('daysLeftText').textContent = `${daysLeft} days left`;

      const [ty, tm, td] = state.targetDate.split('-').map(Number);
      const formattedTarget = new Date(ty, tm - 1, td).toLocaleDateString('en-US', {
        month: 'short', day: 'numeric', year: 'numeric'
      });
      document.getElementById('targetDateBtn').textContent = `Target: ${formattedTarget} ✎`;

      // Render Master Horizon
      const bar = document.getElementById('segmentedBar');
      const tabs = document.getElementById('trackTabs');
      bar.innerHTML = '';
      tabs.innerHTML = '';

      let sumPct = 0;

      state.tracks.forEach((t, idx) => {
        const pct = Math.min(100, Math.round((t.done / Math.max(1, t.target)) * 100));
        sumPct += pct;

        const seg = document.createElement('div');
        seg.className = 'seg-track';
        seg.innerHTML = `<div class="seg-fill" style="width:${pct}%;background:${t.color};"></div>`;
        bar.appendChild(seg);

        const tab = document.createElement('button');
        tab.className = `track-tab ${idx === state.activeIndex ? 'active' : ''}`;
        tab.onclick = () => { state.activeIndex = idx; saveState(); render(); };
        tab.innerHTML = `
          <div class="track-tab-left">
            <span class="track-code">${t.id} · ${t.checkpointLabel}</span>
            <span class="track-name">${t.short}</span>
          </div>
          <span class="track-stat" style="color:${t.color}">${t.done >= t.target ? '✓' : `${t.done}/${t.target}`}</span>
        `;
        tabs.appendChild(tab);
      });

      document.getElementById('overallPctText').textContent = `${Math.round(sumPct / state.tracks.length)}% OVERALL`;

      // Render Active Focus Card
      const cur = state.tracks[state.activeIndex];
      const curPct = Math.min(100, Math.round((cur.done / Math.max(1, cur.target)) * 100));
      const gateDays = Math.max(1, daysUntil(cur.checkpoint));
      const remaining = Math.max(0, cur.target - cur.done);
      const pacePerWeek = ((remaining / gateDays) * 7).toFixed(1);

      const badge = document.getElementById('paceBadge');
      badge.style.background = cur.soft;
      badge.style.color = cur.color;
      badge.textContent = remaining === 0
        ? `✓ ${cur.id} GATE CLEARED`
        : `${cur.id} ACTIVE · NEED ${pacePerWeek}/WK`;

      document.getElementById('focusHeadline').textContent = cur.title;
      document.getElementById('focusMeta').textContent = remaining === 0
        ? `Target reached ahead of ${cur.checkpointLabel} checkpoint`
        : `${remaining} remaining before ${cur.checkpointLabel} (${gateDays}d left)`;

      document.getElementById('focusPct').textContent = `${curPct}%`;
      document.getElementById('focusFraction').textContent = `${cur.done} / ${cur.target}`;

      const ring = document.getElementById('ringCircle');
      ring.style.stroke = cur.color;
      ring.style.strokeDashoffset = 125.66 - (125.66 * curPct) / 100;

      // Render Real Entries List
      document.getElementById('logSectionTitle').textContent = `${cur.id} ${cur.short} Tracker (${cur.entries.length})`;
      document.getElementById('entryInput').placeholder = cur.placeholder;

      const list = document.getElementById('entryList');
      list.innerHTML = '';

      if (cur.entries.length === 0) {
        list.innerHTML = `<div style="font-size:13px;color:var(--text-muted);padding:8px 2px;">No items logged yet. Type your first real contact, application, or prep task above and hit Add.</div>`;
      } else {
        cur.entries.forEach(item => {
          const row = document.createElement('div');
          row.className = `entry-item ${item.completed ? 'done' : ''}`;
          row.innerHTML = `
            <div class="entry-left" onclick="toggleEntry(${item.id})">
              <div class="check-box">${item.completed ? '✓' : ''}</div>
              <div>
                <div class="entry-text">${escapeHtml(item.text)}</div>
                <div class="entry-date">${item.date}</div>
              </div>
            </div>
            <button class="del-btn" onclick="deleteEntry(${item.id})" title="Delete">✕</button>
          `;
          list.appendChild(row);
        });
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }

    function adjustCount(delta) {
      const cur = state.tracks[state.activeIndex];
      cur.done = Math.max(0, cur.done + delta);
      saveState();
      render();
    }

    function addEntry(e) {
      e.preventDefault();
      const input = document.getElementById('entryInput');
      const val = input.value.trim();
      if (!val) return;
      const cur = state.tracks[state.activeIndex];
      const todayLabel = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      cur.entries.unshift({
        id: Date.now(),
        text: val,
        completed: false,
        date: todayLabel
      });
      input.value = '';
      saveState();
      render();
    }

    function toggleEntry(id) {
      const cur = state.tracks[state.activeIndex];
      const item = cur.entries.find(x => x.id === id);
      if (!item) return;
      item.completed = !item.completed;
      cur.done = Math.max(0, cur.done + (item.completed ? 1 : -1));
      saveState();
      render();
    }

    function deleteEntry(id) {
      const cur = state.tracks[state.activeIndex];
      cur.entries = cur.entries.filter(x => x.id !== id);
      saveState();
      render();
    }

    function switchTrack(dir) {
      state.activeIndex = (state.activeIndex + dir + state.tracks.length) % state.tracks.length;
      saveState();
      render();
    }

    function toggleTheme() {
      state.darkMode = !state.darkMode;
      saveState();
      render();
    }

    function editTargetDate() {
      const next = prompt('Enter your target offer date (YYYY-MM-DD):', state.targetDate);
      if (next && /^\d{4}-\d{2}-\d{2}$/.test(next)) {
        state.targetDate = next;
        saveState();
        render();
      }
    }

    function editTrackTarget() {
      const cur = state.tracks[state.activeIndex];
      const next = parseInt(prompt(`Set target quota for ${cur.short}:`, cur.target), 10);
      if (!isNaN(next) && next > 0) {
        cur.target = next;
        saveState();
        render();
      }
    }

    // Touch swipe support on Focus Card
    let startX = 0;
    const focusCard = document.getElementById('focusCard');
    focusCard.addEventListener('touchstart', e => { startX = e.changedTouches[0].screenX; }, { passive: true });
    focusCard.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].screenX - startX;
      if (dx < -45) switchTrack(1);
      if (dx > 45) switchTrack(-1);
    }, { passive: true });

    // Export real live stats as a clean 9:16 Lock Screen Wallpaper PNG
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function exportLockScreenPNG() {
      const canvas = document.getElementById('wallpaperCanvas');
      canvas.width = 1080;
      canvas.height = 1920;
      const ctx = canvas.getContext('2d');
      const dark = state.darkMode;

      ctx.fillStyle = dark ? '#0D1015' : '#F4F7FB';
      ctx.fillRect(0, 0, 1080, 1920);

      // Top 34% left clean for iOS/Android lock screen clock & widgets
      ctx.fillStyle = dark ? '#161B24' : '#FFFFFF';
      roundRect(ctx, 84, 720, 912, 360, 48);
      ctx.fill();

      const daysLeft = daysUntil(state.targetDate);
      ctx.fillStyle = dark ? '#94A3B8' : '#5F6775';
      ctx.font = '700 26px sans-serif';
      ctx.fillText(`SUMMER 2027 PM SPRINT · ${daysLeft} DAYS LEFT`, 136, 790);

      state.tracks.forEach((t, i) => {
        const bx = 136 + i * 204;
        const ratio = Math.min(1, t.done / Math.max(1, t.target));
        ctx.fillStyle = dark ? '#242B38' : '#E6ECF5';
        roundRect(ctx, bx, 822, 192, 16, 8);
        ctx.fill();
        ctx.fillStyle = t.color;
        roundRect(ctx, bx, 822, Math.max(20, 192 * ratio), 16, 8);
        ctx.fill();

        const cx = 136 + (i % 2) * 412;
        const cy = 874 + Math.floor(i / 2) * 86;
        ctx.fillStyle = dark ? '#1F2633' : '#EAF0F8';
        roundRect(ctx, cx, cy, 392, 70, 22);
        ctx.fill();
        ctx.fillStyle = dark ? '#F1F5F9' : '#181C23';
        ctx.font = '700 26px sans-serif';
        ctx.fillText(`${t.id} ${t.short} · ${t.done}/${t.target}`, cx + 24, cy + 44);
      });

      const cur = state.tracks[state.activeIndex];
      ctx.fillStyle = dark ? '#161B24' : '#FFFFFF';
      roundRect(ctx, 84, 1120, 912, 440, 52);
      ctx.fill();

      ctx.fillStyle = dark ? '#8AB4F8' : '#1A73E8';
      ctx.font = '800 24px sans-serif';
      ctx.fillText(`ACTIVE FOCUS · ${cur.id} (${cur.checkpointLabel.toUpperCase()})`, 136, 1196);

      ctx.fillStyle = dark ? '#F1F5F9' : '#181C23';
      ctx.font = '800 46px sans-serif';
      ctx.fillText(cur.title, 136, 1280);

      const pct = Math.min(100, Math.round((cur.done / Math.max(1, cur.target)) * 100));
      ctx.fillStyle = dark ? '#94A3B8' : '#5F6775';
      ctx.font = '600 28px sans-serif';
      ctx.fillText(`${cur.done} of ${cur.target} completed (${pct}%)`, 136, 1352);

      const nextTask = cur.entries.find(e => !e.completed);
      if (nextTask) {
        ctx.fillStyle = dark ? '#8AB4F8' : '#1A73E8';
        ctx.font = '700 26px sans-serif';
        ctx.fillText(`Next: ${nextTask.text.slice(0, 46)}`, 136, 1445);
      }

      const link = document.createElement('a');
      link.download = `PM_Sprint_LockScreen_${daysLeft}d.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    render();
  </script>
</body>
</html>
